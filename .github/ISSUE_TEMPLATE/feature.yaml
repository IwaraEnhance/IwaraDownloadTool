name: 功能请求
description: 为脚本提交新功能建议。
title: "[功能]: "
type: Feature
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 在提交功能请求之前...
      options:
        - label: 我已经搜索了现有的功能请求，且没有找到类似的功能请求
          required: true
        - label: 我在提交功能请求之前至少花费了 5 分钟来思考和准备
          required: true
        - label: 我填写了简短且清晰明确的标题，以便开发者在翻阅 Issue 列表时能快速确定大致情况
          required: true
        - label: 我未仔细阅读这些内容，并相信这不会影响后续的处理
          required: false
        - label: 我正在使用最新版的脚本
          required: false
  - type: dropdown
    id: browsers
    attributes:
      label: 使用的浏览器是？
      options:
        - Firefox
        - Chrome
        - Safari
        - Microsoft Edge
        - 其他（例如：XXX极速、XXX安全等）
    validations:
      required: true
  - type: dropdown
    id: scriptManager
    attributes:
      label: 使用的脚本管理器是？
      options:
        - Tampermonkey
        - Tampermonkey Beta
        - ScriptCat
        - Violentmonkey
        - 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 脚本的版本是？
      placeholder: 例如3.1.1
    validations:
      required: true
  - type: textarea
    id: describe
    attributes:
      label: 描述你的功能建议
      description: 简要描述你的功能建议
    validations:
      required: true
  - type: textarea
    id: others
    attributes:
      label: 功能建议的具体描述
      description: |
        相关的信息？链接？参考资料？
        任何能让我们对你所提出的功能建议有更多了解的东西。
    validations:
      required: false
  - type: checkboxes
    id: finalCheck
    attributes:
      label: 最后一步...
      options:
        - label: 我未认真填写上述内容，并相信这不会影响后续的处理
          required: false
