name: Feature Request
description: Request a feature for the script.
title: "[Feature]: "
type: Feature
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before Making a Feature Request...
      options:
        - label: I have searched existing feature requests and found no similar ones
          required: true
        - label: I have spent at least 5 minutes thinking and preparing before making this feature request
          required: true
        - label: I have filled in a short and clear title so that developers can quickly determine the general situation when browsing the Issue list
          required: true
        - label: I have not carefully read these contents and believe this will not affect subsequent processing
          required: false
        - label: I am using the latest version of the script
          required: false
  - type: dropdown
    id: browsers
    attributes:
      label: Which browser are you using?
      options:
        - Firefox
        - Chrome
        - Safari
        - Microsoft Edge
        - Other
    validations:
      required: true
  - type: dropdown
    id: scriptManager
    attributes:
      label: Which script manager are you using?
      options:
        - Tampermonkey
        - Tampermonkey Beta
        - ScriptCat
        - Violentmonkey
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: What is the script version?
      placeholder: e.g., 3.1.1
    validations:
      required: true
  - type: textarea
    id: describe
    attributes:
      label: Describe Your Feature Request
      description: Briefly describe your feature request
    validations:
      required: true
  - type: textarea
    id: others
    attributes:
      label: Detailed Description of the Feature Request
      description: |
        Any related information? Links? References?
        Anything that helps us understand your feature request better.
    validations:
      required: false
  - type: checkboxes
    id: finalCheck
    attributes:
      label: Final Step...
      options:
        - label: I have not carefully filled in the above contents and believe this will not affect subsequent processing
          required: false
