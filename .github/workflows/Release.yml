name: Release
on:
  push:
    branches:
      - master
    # 仅代码相关改动触发（paths 对标签推送不生效，标签推送始终触发）
    paths:
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "build/**"
      - ".github/workflows/Release.yml"
    tags:
      - "v*"
env:
  release_tag: latest
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  # 判断是否执行正式版流程：
  # - 标签推送：仅当标签指向 master 时才构建正式版
  # - master 分支推送（如合并 PR）：直接执行，自动完成正式版
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      is_latest: ${{ steps.channel.outputs.is_latest }}
    steps:
      - name: 拉取最新代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 拉取 master 分支引用
        run: git fetch origin master
      - name: 判断触发类型与标签指向
        id: channel
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            if git merge-base --is-ancestor ${{ github.sha }} origin/master; then
              echo "is_latest=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_latest=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          fi
  Release:
    needs: check
    if: needs.check.outputs.is_latest == 'true' && github.actor != 'github-actions'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: 初始化Node.js环境
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: 拉取最新代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 安装依赖项
        run: npm ci
      - name: 编译
        run: npm run build ${{ env.release_tag }}
      - name: 获取编译结果
        run: |
          FILES=$(find dist -type f | tr '\n' ' ')
          echo "file_list=${FILES}" >> $GITHUB_ENV
      - name: 获取版本号
        run: |
          PACKAGE_VERSION=$(cat package.json | jq '.version' | tr -d '"')
          echo "current_version=${PACKAGE_VERSION}" >> $GITHUB_ENV
      # master 分支推送时：确保版本标签 vX.Y.Z 指向 master HEAD 并推送（合并即自动发布）
      # 该推送由 github-actions 执行，重跑会被 if 守卫跳过，不会循环
      - name: 确保版本标签指向 master（master 分支推送时）
        if: github.ref_type == 'branch'
        run: |
          if git rev-parse -q --verify "refs/tags/v${current_version}" >/dev/null; then
            git tag -f "v${current_version}"
          else
            git tag "v${current_version}"
          fi
          git push origin "refs/tags/v${current_version}" --force
      # 仅删除同名 Release（保留已推送的标签，避免触发自身导致循环）
      - run: gh release delete v${{ env.current_version }} --yes
        continue-on-error: true
      - name: 发布版本存档
        run: |
          gh release create v${{ env.current_version }} ${{ env.file_list }} \
            --title "${{ env.current_version }}" \
            --notes "v${{ env.current_version }} ${{ github.sha }}"
        continue-on-error: true
      # latest 移动标签不匹配 v* 触发器，可安全 cleanup
      - run: gh release delete ${{ env.release_tag }} --cleanup-tag --yes
        continue-on-error: true
      - name: 发布正式版本
        run: |
          gh release create ${{ env.release_tag }} ${{ env.file_list }} \
            --latest \
            --title "正式版/Release ${{ env.current_version }}" \
            --generate-notes
      - name: 删除Dev分支
        run: |
          # 判断远端是否存在 dev
          if git ls-remote --heads origin dev | grep -q 'dev'; then
            echo "Deleting remote dev branch"
            git push origin --delete dev
          else
            echo "Remote dev branch already deleted"
          fi
      - name: 重建Dev分支
        run: |
          git checkout -b dev origin/master
          git push origin dev
